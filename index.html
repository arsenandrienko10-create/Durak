#sp{position:fixed;inset:0;z-index:99;background:radial-gradient(ellipse at 50% 38%,#2c4f73 0%,#10202f 62%,#060d14 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .7s;overflow:hidden}

/* видеофон меню */

/* Положи ролики рядом с файлом игры (например, папка video/) и впиши пути сюда.
   Подойдут .mp4 (H.264) или .webm — короткие бесшовные ролики, 720p, 5–15 МБ.

const MENU_VIDEOS=[
  // 'video/cards1.mp4',
  // 'video/cards2.mp4',
  // 'video/poker-hands.mp4',
];
const VBG={el:null,cv:null,raf:0,vids:[],cur:-1,t:0,ok:false};
function vbgInit(){
  if(VBG.el)return;
  const el=document.createElement('div');el.id='vbg';document.body.insertBefore(el,document.body.firstChild);VBG.el=el;
  const cv=document.createElement('canvas');el.appendChild(cv);VBG.cv=cv;

    const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.preload=i?'none':'auto';v.loop=MENU_VIDEOS.length===1;

    v.onended=()=>vbgNext();

  });

function vbgNext(){
  const L=VBG.vids.filter(v=>!v.dataset.bad);
  VBG.vids.forEach(v=>{v.classList.remove('on')});
  if(!L.length||document.hidden){VBG.cur=-1;VBG.cv.classList.add('on');return}
  let i=VBG.cur;do{i=(i+1)%VBG.vids.length}while(VBG.vids[i].dataset.bad);

  const show=()=>{if(VBG.cur===i&&document.body.classList.contains('vm')){v.classList.add('on');VBG.cv.classList.remove('on')}};
  v.onplaying=show;
  if(p&&p.catch)p.catch(()=>{v.dataset.bad=1;vbgNext()});

function vbgOn(){

/* встроенный «живой» фон: плывущие карты + боке */
const FX={cards:[],bok:[],w:0,h:0};
function fx(){
  const cv=VBG.cv;
  const rs=()=>{const dpr=Math.min(2,devicePixelRatio||1);FX.w=innerWidth;FX.h=innerHeight;cv.width=FX.w*dpr;cv.height=FX.h*dpr;cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0)};
  rs();addEventListener('resize',rs);
  const n=Math.round(Math.min(22,Math.max(12,FX.w*FX.h/38000)));
  const R=(a,b)=>a+Math.random()*(b-a),SU=['♠','♥','♦','♣'],RK=['A','K','Q','J','10','9','8','7','6'];
  FX.cards=Array.from({length:n},()=>{const z=R(.35,1);return{x:R(0,FX.w),y:R(0,FX.h),z,w:62*z*1.5,vx:R(-.12,.12)*z,vy:R(-.5,-.15)*z,a:R(0,6.28),va:R(-.006,.006),s:SU[Math.random()*4|0],r:RK[Math.random()*9|0]}}).sort((p,q)=>p.z-q.z);

}
function fxStart(){
  if(VBG.raf)return;
  const cv=VBG.cv,c=cv.getContext('2d');
  const rd=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  const loop=t=>{
    VBG.raf=requestAnimationFrame(loop);
    if(document.hidden||!cv.classList.contains('on'))return;
    const W=FX.w,H=FX.h;
    const g=c.createRadialGradient(W/2,H*.35,0,W/2,H*.35,Math.max(W,H)*.85);g.addColorStop(0,'#24506f');g.addColorStop(.55,'#102638');g.addColorStop(1,'#050b11');
    c.globalCompositeOperation='source-over';c.fillStyle=g;c.fillRect(0,0,W,H);
    c.globalCompositeOperation='lighter';
    FX.bok.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<-b.r)b.x=W+b.r;if(b.x>W+b.r)b.x=-b.r;if(b.y<-b.r)b.y=H+b.r;if(b.y>H+b.r)b.y=-b.r;
      const al=.07+.05*Math.sin(t/1400+b.p),q=c.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);q.addColorStop(0,`rgba(${b.c},${al})`);q.addColorStop(1,`rgba(${b.c},0)`);c.fillStyle=q;c.beginPath();c.arc(b.x,b.y,b.r,0,6.3);c.fill()});
    c.globalCompositeOperation='source-over';
    FX.cards.forEach(k=>{k.x+=k.vx;k.y+=k.vy;k.a+=k.va;const h=k.w*1.45;if(k.y<-h)k.y=H+h;if(k.x<-k.w)k.x=W+k.w;if(k.x>W+k.w)k.x=-k.w;
      c.save();c.translate(k.x,k.y);c.rotate(k.a);c.globalAlpha=.1+.28*k.z;c.shadowColor='#000';c.shadowBlur=14*k.z;c.shadowOffsetY=5*k.z;
      c.fillStyle='#f6f1e4';rd(-k.w/2,-h/2,k.w,h,k.w*.09);c.fill();c.shadowColor='transparent';
      c.fillStyle=(k.s==='♥'||k.s==='♦')?'#c0392b':'#1b1b1b';c.textAlign='center';c.textBaseline='middle';
      c.font=`700 ${k.w*.34}px Georgia,serif`;c.fillText(k.r,0,-h*.3);c.font=`${k.w*.62}px serif`;c.fillText(k.s,0,h*.08);c.restore()});
    c.globalAlpha=1;
  };
  VBG.raf=requestAnimationFrame(loop);
}

  else if(D.o){const k=D.o,it=(k[0]==='b'?BK:k[0]==='d'?DKS:TB)[+k.slice(1)];if(!hv(k)){if(bank<it[1]){NOTE='Не хватает zł на «'+it[0]+'»';menu();return}if(BUY!==k){BUY=k;NOTE='Нажми ещё раз, чтобы купить «'+it[0]+'» за '+it[1]+' zł';menu();return}BUY=null;NOTE='';bank-=it[1];sv();ST.own.push(k)}ST[k[0]==='b'?'cb':k[0]==='d'?'cd':'ct']=+k.slice(1);saveST();applyTheme();menu()}
  else if(D.a==='again'&&G&&G.rv)send({t:'again'});else if(D.a==='again'&&G&&G.mp)startMP();else if(D.a==='play'||D.a==='again'){if(bank>=stake)start();else{G=null;menu()}}
  else if(D.a==='wheel'){if(ST.wh!==dk()){const p=rnd([20,50,50,100,100,150,300,500]);bank+=p;sv();ST.wh=dk();ST.wp=p;saveST();menu()}}else if(D.a==='wat'){G.wd=1;render()}else if(D.a==='resume'){loadG()||menu()}else if(D.a==='hold'){saveG();T=null;G=null;menu()}else if(D.a==='bonus'){bank+=500;sv();menu()}
  else if(D.a==='act'){if(G.rv)send({t:'act'});else act('p')}else if(D.a==='ex')useEx();
  else if(D.a==='daily'){const x=dl();if(x){ST.db={d:dk(),s:x.n};bank+=x.v;ST.cn=(ST.cn|0)+2;sv();saveST();toast('+'+x.v+' zł и +2 🪙');menu()}}
  else if(D.a==='tour'){if(bank>=stake){bank-=stake;sv();T={r:1,pts:Object.fromEntries(['p',...BI.slice(0,ST.nb||2)].map(k=>[k,0])),fee:stake};start()}}
  else if(D.a==='next'){if(T){T.r++;start()}}
  else if(D.a==='peek'){const g=G;if(g.over||(g.pk&&!(ST.cr&&ST.o.cx)))return;g.pk=1;g.peek=ORD.slice(1).map(x=>`<p><b>${g.nm[x]}</b><br>${g.h[x].map(c=>(LA[c.r]||c.r)+sym(c.s)).join(' ')||'—'}</p>`).join('');render()}

  else if(D.a.startsWith('c:')&&ST.cr)cheat(D.a.slice(2))

  else if(D.a==='yes'){clr();T=null;G=null;menu()}
  else if(D.a==='menu'){if(G&&(G.mp||G.rv))leaveMP();else{G=null;T=null;menu()}}

app.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.hc');if(!el||!G||G.over||G.busy||G.ask)return;
  drag={el,i:+el.dataset.i,sx:e.clientX,sy:e.clientY,mv:false};
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  el.classList.add('drag');
});
app.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(Math.abs(dx)+Math.abs(dy)>10){drag.mv=true;const tb=$('.tbl');if(tb)tb.classList.add('dr')}
  if(drag.mv)drag.el.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;
});
function drop(e,cancel){
  if(!drag)return;const d=drag;drag=null;const tb=$('.tbl');if(tb)tb.classList.remove('dr');
  let ok=false;
  if(!cancel){
    const hr=$('.hand').getBoundingClientRect();
    if(!d.mv||e.clientY<hr.top-10){
      const pr=d.mv?document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('pair')):null;
      if(G.rv){const c=G.h.p[d.i];if(c)send({t:'play',c:{s:c.s,r:c.r},g:pr?+pr.dataset.t:-1,m:d.mv&&!pr});render();return}
      ok=play('p',d.i,pr?G.t[+pr.dataset.t]:null,d.mv&&!pr);
    }
  }
  if(!ok){render();const b=document.querySelector(`.hc[data-i="${d.i}"]`);if(b&&!cancel)b.classList.add('bad')}
}
app.addEventListener('pointerup',e=>drop(e,false));
app.addEventListener('pointercancel',e=>drop(e,true));

const MP={role:null,conn:null,peer:null,id:'',st:'Подключение к серверу…'};
const send=m=>{try{if(MP.conn&&MP.conn.open)MP.conn.send(m)}catch(e){}};
function mpUp(m){if(m)MP.st=m;const a=$('#myid'),b=$('#mps');if(a)a.textContent=MP.id||'…';if(b)b.textContent=MP.st}
function snap(){
  const g=G,m={l:'p',r:'l',p:'r'},o={rv:1,mp:1,tr:g.tr,tc:g.tc,deck:{length:g.deck.length},t:g.t,att:m[g.att],def:m[g.def],over:g.over,busy:false,ask:false,stake:0,h:{},bub:{},lb:lbl('l'),hn:g.h.l.map(c=>okc('l',c)),nm:{p:'Ты',l:'Зося',r:'Друг'},durak:g.durak?m[g.durak]:g.durak,av:{p:g.av.l||null,r:g.av.p}};
  ORD.forEach(x=>{o.h[m[x]]=x==='l'?g.h.l:g.h[x].map(()=>0);if(g.bub[x])o.bub[m[x]]=g.bub[x];if(g.res)(o.res=o.res||{})[m[x]]=g.res[x]});
  return o;
}
function startMP(){if(MP.conn&&MP.conn.open)start(true)}
function leaveMP(){const c=MP.conn;MP.conn=null;MP.role=null;G=null;H=['p'];MP.st='Готов';try{c&&c.close()}catch(e){}menu()}
const cn=c=>c?{s:(+c.s|0)&3,r:Math.max(6,Math.min(14,+c.r|0))}:0,ID=['p','l','r'];
function sane(o){const n=o.nm||{};o.nm={p:esc(n.p||'Ты'),l:esc(n.l||'Зося'),r:esc(n.r||'Друг')};o.lb=esc(o.lb||'');for(const k in o.bub||{})o.bub[k]={cls:o.bub[k].cls==='em'?'em':'',t:esc(o.bub[k].t)};o.t=(o.t||[]).map(p=>({a:cn(p.a),d:cn(p.d),by:'p',j:[0,1,2,3].map(i=>+(p.j||[])[i]|0)}));o.tc=cn(o.tc)||{s:0,r:6};o.tr=(+o.tr|0)&3;o.deck={length:+(o.deck||{}).length|0};o.h=o.h||{};for(const k of ID)o.h[k]=(o.h[k]||[]).map(c=>cn(c));o.att=ID.includes(o.att)?o.att:'p';o.def=ID.includes(o.def)?o.def:'l';o.hn=(o.hn||[]).map(Boolean)}
function onData(d){if(d&&d.t==='av'&&MP.role==='host'){MP.fav=cleanAv(d.a);if(G&&G.mp){G.av.l=MP.fav;render()}return}
  if(!d)return;
  if(MP.role==='guest'&&d.t==='s'){
    ORD=['p','l','r'];const o=d.s,pv=G&&G.rv?G:null;sane(o);
    o.av=o.av||{};for(const k in o.av)o.av[k]=o.av[k]?cleanAv(o.av[k]):null;if(!o.av.p)o.av.p=cleanAv(ST.av);
    if(pv){const n=q=>q.t.reduce((a,p)=>a+1+(p.d?1:0),0);if(n(o)>n(pv))snd('card');else if(!o.t.length&&pv.t.length&&!o.over)snd('beat');if(o.lb&&!pv.lb)snd('turn');if(o.over){if(!pv.over){o.ac=recS(o,o.durak,o.av.r?o.av.r.n:'Друг','r');o.cc=cReward(o,o.durak);ST.cn=(ST.cn|0)+o.cc;saveST();snd(o.durak==='p'?'lose':'win')}else{o.ac=pv.ac;o.cc=pv.cc}}}
    G=o;render();
    Object.keys(o.bub).forEach(x=>setTimeout(()=>{if(G===o){delete o.bub[x];const e=document.getElementById('b-'+x);if(e)e.remove()}},1700));
  }else if(MP.role==='host'&&G&&G.mp){
    if(d.t==='play'){const i=G.h.l.findIndex(k=>same(k,d.c));if(i>=0)play('l',i,d.g>=0?G.t[d.g]:null,d.m)}
    else if(d.t==='act')act('l');
    else if(d.t==='rx'&&EM.includes(d.e)){say('l',d.e);react(d.e,'l')}
    else if(d.t==='again'&&G.over)startMP();
  }
}
function hook(c,role){
  MP.conn=c;MP.role=role;
  c.on('open',()=>{MP.st='Друг подключён';mpUp();if(role==='host')startMP();else send({t:'av',a:ST.av})});
  c.on('data',onData);
  c.on('close',()=>{if(MP.conn!==c)return;const was=G&&(G.mp||G.rv);MP.fav=null;MP.conn=null;MP.role=null;MP.st='Друг отключился';H=['p'];if(was){G=null;menu();alert('Друг вышел из игры')}else mpUp()});
}
function initPeer(){
  if(typeof Peer==='undefined'){MP.st='PeerJS не загрузился — нужен интернет';return mpUp()}
  const code=Math.random().toString(36).slice(2,7).toUpperCase(),p=new Peer('durak-'+code);MP.peer=p;
  p.on('open',()=>{MP.id=code;MP.st='Готов к игре';mpUp();const j=(new URLSearchParams(location.search).get('j')||'').toUpperCase();if(j&&!MP.conn)join(j)});
  p.on('connection',c=>{if(MP.conn){c.close();return}hook(c,'host')});
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  p.on('error',e=>{if(e.type==='unavailable-id'){MP.peer=null;return initPeer()}if(e.type==='peer-unavailable'){MP.conn=null;MP.role=null;MP.st='Друг с таким ID не найден'}else MP.st='Ошибка связи: '+e.type;mpUp()});
}
function join(c0){
  const v=(c0||($('#fid')||{}).value||'').trim().toUpperCase();
  if(!MP.id)return mpUp('Ждём подключения к серверу…');
  if(!v||v===MP.id)return mpUp('Введи ID друга');
  if(MP.conn)return;
  mpUp('Соединяем…');const c=MP.peer.connect('durak-'+v,{serialization:'json'});hook(c,'guest');
  setTimeout(()=>{if(MP.conn===c&&!c.open){try{c.close()}catch(e){}MP.conn=null;MP.role=null;mpUp('Не удалось подключиться')}},12000);
}
